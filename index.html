<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Target Strike</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080b10;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  top:15px;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 18px;
  color:white;
  font-weight:bold;
  font-size:18px;
  z-index:5;
  pointer-events:none;
}

.hudBox{
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.18);
  padding:8px 12px;
  border-radius:10px;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  width:38px;
  height:38px;
  transform:translate(-50%,-50%);
  z-index:4;
  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:#fff;
  opacity:.9;
}

#crosshair:before{
  width:38px;
  height:2px;
  top:18px;
  left:0;
}

#crosshair:after{
  width:2px;
  height:38px;
  left:18px;
  top:0;
}

#message{
  position:fixed;
  left:50%;
  top:40%;
  transform:translate(-50%,-50%);
  color:white;
  font-size:34px;
  font-weight:900;
  text-align:center;
  text-shadow:0 3px 10px #000;
  z-index:8;
  pointer-events:none;
  opacity:0;
}

#shoot{
  position:fixed;
  right:25px;
  bottom:35px;
  width:105px;
  height:105px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.7);
  background:rgba(210,25,25,.85);
  color:white;
  font-size:20px;
  font-weight:900;
  z-index:7;
  box-shadow:0 8px 25px rgba(0,0,0,.45);
}

#shoot:active{
  transform:scale(.92);
  background:#ff3333;
}

#aimHint{
  position:fixed;
  bottom:20px;
  left:20px;
  color:white;
  background:rgba(0,0,0,.5);
  padding:9px 12px;
  border-radius:9px;
  font-size:13px;
  z-index:5;
}

#startScreen,
#gameOver{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:rgba(5,8,12,.92);
  color:white;
  z-index:20;
  text-align:center;
}

#gameOver{
  display:none;
}

.title{
  font-size:42px;
  font-weight:900;
  margin-bottom:8px;
}

.subtitle{
  color:#aaa;
  margin-bottom:30px;
}

.mainButton{
  border:0;
  border-radius:14px;
  padding:16px 38px;
  font-size:19px;
  font-weight:bold;
  color:white;
  background:#d82020;
}

.mainButton:active{
  transform:scale(.95);
}

#result{
  font-size:22px;
  margin:10px 0 25px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  <div class="hudBox">
    SCORE: <span id="score">0</span>
  </div>

  <div class="hudBox">
    TIME: <span id="time">60</span>
  </div>
</div>

<div id="crosshair"></div>

<div id="message"></div>

<div id="aimHint">
  Tap the screen to aim • SHOOT to fire
</div>

<button id="shoot">SHOOT</button>

<div id="startScreen">
  <div class="title">TARGET STRIKE</div>
  <div class="subtitle">
    Hit the targets before time runs out.
  </div>
  <button class="mainButton" id="startButton">
    START GAME
  </button>
</div>

<div id="gameOver">
  <div class="title">GAME OVER</div>

  <div id="result">
    Score: 0
  </div>

  <button class="mainButton" id="restartButton">
    PLAY AGAIN
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;

let targets = [];
let bullets = [];
let particles = [];

let score = 0;
let timeLeft = 60;

let playing = false;
let timer = null;

let aimX = 0;
let aimY = 0;

const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const messageEl = document.getElementById("message");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");

const resultEl = document.getElementById("result");

const shootButton = document.getElementById("shoot");
const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");


// ===============================
// SCENE
// ===============================

scene = new THREE.Scene();

scene.background = new THREE.Color(0x101820);

scene.fog = new THREE.Fog(
  0x101820,
  20,
  100
);


// ===============================
// CAMERA
// ===============================

camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  200
);

camera.position.set(
  0,
  2.2,
  0
);


// ===============================
// RENDERER
// ===============================

renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.getElementById("game")
  .appendChild(renderer.domElement);


// ===============================
// LIGHTING
// ===============================

const ambient = new THREE.HemisphereLight(
  0xffffff,
  0x303030,
  2
);

scene.add(ambient);

const light = new THREE.DirectionalLight(
  0xffffff,
  2
);

light.position.set(
  5,
  10,
  5
);

scene.add(light);


// ===============================
// GROUND
// ===============================

const groundGeometry =
  new THREE.PlaneGeometry(
    120,
    120
  );

const groundMaterial =
  new THREE.MeshStandardMaterial({
    color:0x263238,
    roughness:1
  });

const ground =
  new THREE.Mesh(
    groundGeometry,
    groundMaterial
  );

ground.rotation.x =
  -Math.PI / 2;

ground.position.y = 0;

scene.add(ground);


// ===============================
// TARGET WALL
// ===============================

const wallGeometry =
  new THREE.BoxGeometry(
    40,
    16,
    1
  );

const wallMaterial =
  new THREE.MeshStandardMaterial({
    color:0x37474f
  });

const wall =
  new THREE.Mesh(
    wallGeometry,
    wallMaterial
  );

wall.position.set(
  0,
  8,
  -45
);

scene.add(wall);


// ===============================
// TARGET CREATION
// ===============================

function createTarget(){

  const group =
    new THREE.Group();

  const bodyGeometry =
    new THREE.CylinderGeometry(
      1.3,
      1.3,
      0.35,
      32
    );

  const bodyMaterial =
    new THREE.MeshStandardMaterial({
      color:0xe53935
    });

  const body =
    new THREE.Mesh(
      bodyGeometry,
      bodyMaterial
    );

  body.rotation.x =
    Math.PI / 2;

  group.add(body);


  // Center
  const centerGeometry =
    new THREE.CylinderGeometry(
      0.72,
      0.72,
      0.38,
      32
    );

  const centerMaterial =
    new THREE.MeshStandardMaterial({
      color:0xffffff
    });

  const center =
    new THREE.Mesh(
      centerGeometry,
      centerMaterial
    );

  center.rotation.x =
    Math.PI / 2;

  center.position.z =
    -0.02;

  group.add(center);


  // Bullseye
  const bullGeometry =
    new THREE.CylinderGeometry(
      0.32,
      0.32,
      0.4,
      32
    );

  const bullMaterial =
    new THREE.MeshStandardMaterial({
      color:0x111111
    });

  const bull =
    new THREE.Mesh(
      bullGeometry,
      bullMaterial
    );

  bull.rotation.x =
    Math.PI / 2;

  bull.position.z =
    -0.04;

  group.add(bull);


  group.position.x =
    (Math.random() - .5) * 22;

  group.position.y =
    2.5 +
    Math.random() * 8;

  group.position.z =
    -25 -
    Math.random() * 15;


  group.userData = {
    points:100,
    speed:.8 +
      Math.random() * .7,

    baseX:group.position.x,
    baseY:group.position.y,

    phase:Math.random()*10
  };


  scene.add(group);

  targets.push(group);
}


// ===============================
// TARGET STARTING SET
// ===============================

function createTargets(){

  for(let i=0;i<7;i++){
    createTarget();
  }

}


// ===============================
// BULLET
// ===============================

function shoot(){

  if(!playing) return;

  const bulletGeometry =
    new THREE.SphereGeometry(
      0.09,
      8,
      8
    );

  const bulletMaterial =
    new THREE.MeshBasicMaterial({
      color:0xffd54f
    });

  const bullet =
    new THREE.Mesh(
      bulletGeometry,
      bulletMaterial
    );


  bullet.position.copy(
    camera.position
  );


  const direction =
    new THREE.Vector3(
      aimX,
      aimY,
      -1
    ).normalize();


  bullet.userData = {
    velocity:
      direction.multiplyScalar(1.5),
    life:0
  };


  scene.add(bullet);

  bullets.push(bullet);

}


// ===============================
// HIT EFFECT
// ===============================

function explosion(position){

  for(let i=0;i<15;i++){

    const geometry =
      new THREE.SphereGeometry(
        0.05,
        6,
        6
      );

    const material =
      new THREE.MeshBasicMaterial({
        color:0xffaa00
      });

    const p =
      new THREE.Mesh(
        geometry,
        material
      );

    p.position.copy(position);

    p.userData = {
      velocity:new THREE.Vector3(
        (Math.random()-.5)*.3,
        (Math.random()-.5)*.3,
        (Math.random()-.5)*.3
      ),
      life:0
    };

    scene.add(p);

    particles.push(p);
  }

}


// ===============================
// SCORE MESSAGE
// ===============================

function showMessage(text){

  messageEl.textContent =
    text;

  messageEl.style.opacity =
    "1";

  setTimeout(()=>{
    messageEl.style.opacity =
      "0";
  },500);

}


// ===============================
// UPDATE BULLETS
// ===============================

function updateBullets(){

  for(let i=bullets.length-1;i>=0;i--){

    const bullet =
      bullets[i];

    bullet.position.add(
      bullet.userData.velocity
    );

    bullet.userData.life++;


    let hit = false;


    for(let j=targets.length-1;j>=0;j--){

      const target =
        targets[j];

      const distance =
        bullet.position.distanceTo(
          target.position
        );


      if(distance < 1.5){

        const points =
          target.userData.points;


        score += points;

        scoreEl.textContent =
          score;


        explosion(
          target.position
        );


        scene.remove(
          target
        );

        targets.splice(
          j,
          1
        );


        showMessage(
          "+" + points
        );


        createTarget();


        hit = true;

        break;
      }
    }


    if(
      hit ||
      bullet.userData.life > 100
    ){

      scene.remove(
        bullet
      );

      bullets.splice(
        i,
        1
      );
    }

  }

}


// ===============================
// UPDATE PARTICLES
// ===============================

function updateParticles(){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p =
      particles[i];

    p.position.add(
      p.userData.velocity
    );

    p.userData.velocity.y -=
      0.005;

    p.userData.life++;


    if(
      p.userData.life > 40
    ){

      scene.remove(p);

      particles.splice(
        i,
        1
      );

    }

  }

}


// ===============================
// UPDATE TARGETS
// ===============================

let clock =
  new THREE.Clock();

function updateTargets(){

  const t =
    clock.getElapsedTime();


  for(const target of targets){

    target.position.x =
      target.userData.baseX +
      Math.sin(
        t * target.userData.speed +
        target.userData.phase
      ) * 2;

    target.position.y =
      target.userData.baseY +
      Math.sin(
        t * 1.3 +
        target.userData.phase
      ) * .7;

  }

}


// ===============================
// TIMER
// ===============================

function startTimer(){

  clearInterval(timer);

  timer =
    setInterval(()=>{

      if(!playing) return;

      timeLeft--;

      timeEl.textContent =
        timeLeft;


      if(timeLeft <= 0){

        endGame();

      }

    },1000);

}


// ===============================
// START
// ===============================

function startGame(){

  score = 0;

  timeLeft = 60;

  scoreEl.textContent =
    "0";

  timeEl.textContent =
    "60";


  playing = true;


  startScreen.style.display =
    "none";

  gameOverScreen.style.display =
    "none";


  clearTargets();

  clearBullets();

  clearParticles();

  createTargets();

  startTimer();

}


// ===============================
// END
// ===============================

function endGame(){

  playing = false;

  clearInterval(timer);

  resultEl.textContent =
    "Final Score: " + score;

  gameOverScreen.style.display =
    "flex";

}


// ===============================
// CLEAR
// ===============================

function clearTargets(){

  for(const target of targets){

    scene.remove(target);

  }

  targets = [];

}


function clearBullets(){

  for(const bullet of bullets){

    scene.remove(bullet);

  }

  bullets = [];

}


function clearParticles(){

  for(const p of particles){

    scene.remove(p);

  }

  particles = [];

}


// ===============================
// TOUCH AIMING
// ===============================

function updateAim(clientX,clientY){

  const rect =
    renderer.domElement.getBoundingClientRect();


  const x =
    (clientX - rect.left) /
    rect.width;

  const y =
    (clientY - rect.top) /
    rect.height;


  aimX =
    (x - .5) * 1.5;

  aimY =
    -((y - .5) * 1.5);

}


renderer.domElement.addEventListener(
  "pointerdown",
  e=>{
    updateAim(
      e.clientX,
      e.clientY
    );
  }
);


renderer.domElement.addEventListener(
  "pointermove",
  e=>{
    if(e.buttons){
      updateAim(
        e.clientX,
        e.clientY
      );
    }
  }
);


// ===============================
// SHOOT BUTTON
// ===============================

shootButton.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    shoot();
  }
);


// ===============================
// START BUTTON
// ===============================

startButton.addEventListener(
  "click",
  startGame
);


restartButton.addEventListener(
  "click",
  startGame
);


// ===============================
// RESIZE
// ===============================

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


// ===============================
// MAIN LOOP
// ===============================

function animate(){

  requestAnimationFrame(
    animate
  );


  updateTargets();

  updateBullets();

  updateParticles();


  renderer.render(
    scene,
    camera
  );

}


animate();

</script>

</body>
      </html>
