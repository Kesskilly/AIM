<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Football Game V3</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
}

#score{
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:white;
    background:rgba(0,0,0,.7);
    padding:8px 18px;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
}

#timer{
    position:fixed;
    top:55px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:white;
    background:rgba(0,0,0,.55);
    padding:5px 13px;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
}

#stats{
    position:fixed;
    top:88px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:white;
    background:rgba(0,0,0,.45);
    padding:4px 10px;
    border-radius:8px;
    font-size:11px;
}

#message{
    position:fixed;
    top:112px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:white;
    font-size:13px;
    text-align:center;
}

#joystick{
    position:fixed;
    left:20px;
    bottom:20px;
    width:125px;
    height:125px;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    border:2px solid rgba(255,255,255,.4);
    z-index:30;
}

#stick{
    position:absolute;
    width:55px;
    height:55px;
    left:35px;
    top:35px;
    border-radius:50%;
    background:rgba(255,255,255,.82);
}

.button{
    position:fixed;
    z-index:30;
    width:78px;
    height:78px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.5);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
    background:rgba(0,0,0,.58);
}

#shoot{
    right:20px;
    bottom:120px;
}

#pass{
    right:108px;
    bottom:25px;
}

#sprint{
    right:20px;
    bottom:25px;
}

#switch{
    right:108px;
    bottom:115px;
}

#tackle{
    right:196px;
    bottom:25px;
}

#restart{
    position:fixed;
    right:10px;
    top:10px;
    z-index:40;
    border:none;
    border-radius:7px;
    padding:7px 10px;
    font-weight:bold;
}

#gameOver{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.82);
    color:white;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}

#gameOver h1{
    font-size:40px;
    margin:0 0 15px;
}

#finalScore{
    font-size:25px;
    margin-bottom:12px;
}

#finalStats{
    font-size:14px;
    margin-bottom:25px;
    line-height:1.7;
}

#playAgain{
    padding:13px 25px;
    border:0;
    border-radius:9px;
    font-size:17px;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="score">BLUE 0 — 0 RED</div>
<div id="timer">01:30</div>
<div id="stats">SHOTS 0 | TACKLES 0 | PASSES 0</div>
<div id="message">Move with the joystick</div>

<button id="restart">RESTART</button>

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="shoot" class="button">SHOOT</div>
<div id="pass" class="button">PASS</div>
<div id="sprint" class="button">SPRINT</div>
<div id="switch" class="button">SWITCH</div>
<div id="tackle" class="button">TACKLE</div>

<div id="gameOver">
    <h1 id="result">FULL TIME</h1>
    <div id="finalScore">BLUE 0 — 0 RED</div>
    <div id="finalStats"></div>
    <button id="playAgain">PLAY AGAIN</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =====================================================
   BASIC SETUP
===================================================== */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
    0x87ceeb,
    40,
    100
);

const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    .1,
    200
);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

document.body.appendChild(renderer.domElement);


/* =====================================================
   LIGHTING
===================================================== */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x447744,
        2
    )
);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    10,
    30,
    10
);

scene.add(sun);


/* =====================================================
   PITCH
===================================================== */

const pitch =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            24,
            38
        ),
        new THREE.MeshStandardMaterial({
            color:0x188a35
        })
    );

pitch.rotation.x =
    -Math.PI / 2;

scene.add(pitch);


/* =====================================================
   FIELD LINES
===================================================== */

function line(x1,z1,x2,z2){

    const geometry =
        new THREE.BufferGeometry()
        .setFromPoints([
            new THREE.Vector3(
                x1,.04,z1
            ),
            new THREE.Vector3(
                x2,.04,z2
            )
        ]);

    scene.add(
        new THREE.Line(
            geometry,
            new THREE.LineBasicMaterial({
                color:0xffffff
            })
        )
    );
}

line(-12,-19,12,-19);
line(12,-19,12,19);
line(12,19,-12,19);
line(-12,19,-12,-19);
line(-12,0,12,0);


/* Center circle */

const circlePoints=[];

for(let i=0;i<=64;i++){

    const a =
        i / 64 * Math.PI * 2;

    circlePoints.push(
        new THREE.Vector3(
            Math.cos(a)*3,
            .04,
            Math.sin(a)*3
        )
    );
}

scene.add(
    new THREE.Line(
        new THREE.BufferGeometry()
        .setFromPoints(circlePoints),
        new THREE.LineBasicMaterial({
            color:0xffffff
        })
    )
);


/* =====================================================
   GOALS
===================================================== */

function createGoal(z){

    const group =
        new THREE.Group();

    const mat =
        new THREE.MeshStandardMaterial({
            color:0xffffff
        });

    const post =
        new THREE.BoxGeometry(
            .3,3,.3
        );

    const cross =
        new THREE.BoxGeometry(
            6,.3,.3
        );

    const left =
        new THREE.Mesh(post,mat);

    left.position.set(
        -3,1.5,0
    );

    group.add(left);

    const right =
        new THREE.Mesh(post,mat);

    right.position.set(
        3,1.5,0
    );

    group.add(right);

    const bar =
        new THREE.Mesh(cross,mat);

    bar.position.set(
        0,3,0
    );

    group.add(bar);

    const net =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                6,3,1
            ),
            new THREE.MeshBasicMaterial({
                color:0xffffff,
                transparent:true,
                opacity:.12,
                wireframe:true
            })
        );

    net.position.z =
        z < 0 ? .5 : -.5;

    net.position.y=1.5;

    group.add(net);

    group.position.z=z;

    scene.add(group);
}

createGoal(-19);
createGoal(19);


/* =====================================================
   PLAYER CREATION
===================================================== */

function createPlayer(
    color,
    number
){

    const group =
        new THREE.Group();

    const body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .42,
                1.05,
                4,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:color
            })
        );

    body.position.y=1;

    group.add(body);

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .3,
                16,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0xffc79b
            })
        );

    head.position.y=1.95;

    group.add(head);

    return group;
}


/* =====================================================
   TEAM DATA
===================================================== */

const blueTeam=[];
const redTeam=[];


/* =====================================================
   BLUE TEAM
===================================================== */

const bluePositions=[
    [0,10],
    [-7,6],
    [7,6],
    [-5,1],
    [5,1],
    [0,-4]
];

bluePositions.forEach(
    (pos,index)=>{

        const p =
            createPlayer(
                0x1677ff,
                index+1
            );

        p.position.set(
            pos[0],
            0,
            pos[1]
        );

        scene.add(p);

        blueTeam.push(p);
    }
);


/* =====================================================
   RED TEAM
===================================================== */

const redPositions=[
    [0,-10],
    [-7,-5],
    [7,-5],
    [-5,-1],
    [5,-1],
    [0,5]
];

redPositions.forEach(
    (pos,index)=>{

        const p =
            createPlayer(
                0xff2222,
                index+1
            );

        p.position.set(
            pos[0],
            0,
            pos[1]
        );

        scene.add(p);

        redTeam.push(p);
    }
);


/* =====================================================
   GOALKEEPER
===================================================== */

const goalkeeper =
    createPlayer(
        0xffaa00,
        1
    );

goalkeeper.position.set(
    0,
    0,
    -17.2
);

scene.add(goalkeeper);


/* =====================================================
   ACTIVE PLAYER
===================================================== */

let activeIndex=0;

let player =
    blueTeam[activeIndex];

let ballOwner=null;


/* Highlight active player */

function updateActivePlayer(){

    blueTeam.forEach(
        p=>{
            p.scale.set(
                1,
                1,
                1
            );
        }
    );

    player.scale.set(
        1.12,
        1.12,
        1.12
    );
}

updateActivePlayer();


/* =====================================================
   BALL
===================================================== */

const ball =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .35,
            20,
            20
        ),
        new THREE.MeshStandardMaterial({
            color:0xffffff
        })
    );

ball.position.set(
    0,
    .35,
    7
);

scene.add(ball);

let ballVelocity =
    new THREE.Vector3();


/* =====================================================
   SCORE + STATS
===================================================== */

let blueScore=0;
let redScore=0;

let shots=0;
let tackles=0;
let passes=0;

function updateScore(){

    document.getElementById(
        "score"
    ).textContent =
        `BLUE ${blueScore} — ${redScore} RED`;
}

function updateStats(){

    document.getElementById(
        "stats"
    ).textContent =
        `SHOTS ${shots} | TACKLES ${tackles} | PASSES ${passes}`;
}


/* =====================================================
   TIMER
===================================================== */

let timeLeft=90;
let timerAccumulator=0;
let gameRunning=true;

function updateTimer(){

    const m =
        Math.floor(timeLeft/60);

    const s =
        timeLeft%60;

    document.getElementById(
        "timer"
    ).textContent =
        String(m).padStart(2,"0")
        + ":" +
        String(s).padStart(2,"0");
}


/* =====================================================
   JOYSTICK
===================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

let joystickX=0;
let joystickY=0;
let joystickActive=false;

function moveJoystick(x,y){

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left+
        rect.width/2;

    const centerY =
        rect.top+
        rect.height/2;

    let dx=x-centerX;
    let dy=y-centerY;

    const max =
        rect.width/2-28;

    const distance =
        Math.sqrt(
            dx*dx+
            dy*dy
        );

    if(distance>max){

        dx=
            dx/distance*max;

        dy=
            dy/distance*max;
    }

    joystickX=dx/max;
    joystickY=dy/max;

    stick.style.transform =
        `translate(${dx}px,${dy}px)`;
}

joystick.addEventListener(
    "pointerdown",
    e=>{

        joystickActive=true;

        joystick.setPointerCapture(
            e.pointerId
        );

        moveJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointermove",
    e=>{

        if(!joystickActive)
            return;

        moveJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointerup",
    ()=>{

        joystickActive=false;

        joystickX=0;
        joystickY=0;

        stick.style.transform=
            "translate(0px,0px)";
    }
);


/* =====================================================
   SPRINT
===================================================== */

let sprinting=false;

const sprintButton =
    document.getElementById(
        "sprint"
    );

sprintButton.addEventListener(
    "pointerdown",
    ()=>{
        sprinting=true;
    }
);

sprintButton.addEventListener(
    "pointerup",
    ()=>{
        sprinting=false;
    }
);

sprintButton.addEventListener(
    "pointercancel",
    ()=>{
        sprinting=false;
    }
);


/* =====================================================
   PLAYER SWITCH
===================================================== */

function switchPlayer(){

    if(!gameRunning)
        return;

    activeIndex++;

    if(activeIndex>=blueTeam.length)
        activeIndex=0;

    player=
        blueTeam[activeIndex];

    updateActivePlayer();

    document.getElementById(
        "message"
    ).textContent=
        "Player switched";
}

document.getElementById(
    "switch"
).addEventListener(
    "pointerdown",
    switchPlayer
);


/* =====================================================
   BALL POSSESSION
===================================================== */

function tryTakeBall(){

    const distance =
        player.position.distanceTo(
            ball.position
        );

    if(distance<1.4){

        ballOwner=player;

        ballVelocity.set(
            0,0,0
        );
    }
}


/* Keep ball near player */

function updatePossession(){

    if(!ballOwner)
        return;

    if(
        !blueTeam.includes(
            ballOwner
        )
    ){

        ballOwner=null;

        return;
    }

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    forward.applyQuaternion(
        ballOwner.quaternion
    );

    const target =
        ballOwner.position
        .clone()
        .add(
            forward.multiplyScalar(
                .85
            )
        );

    target.y=.35;

    ball.position.lerp(
        target,
        .35
    );
}


/* =====================================================
   SHOOT
===================================================== */

function shoot(){

    if(!gameRunning)
        return;

    const distance =
        player.position.distanceTo(
            ball.position
        );

    if(
        distance<2.2 ||
        ballOwner===player
    ){

        ballOwner=null;

        const direction =
            new THREE.Vector3(
                0,0,-1
            );

        direction.applyQuaternion(
            player.quaternion
        );

        ballVelocity.copy(
            direction.multiplyScalar(
                15
            )
        );

        ballVelocity.y=5;

        shots++;

        updateStats();
    }
}

document.getElementById(
    "shoot"
).addEventListener(
    "pointerdown",
    shoot
);


/* =====================================================
   PASS
===================================================== */

function passBall(){

    if(!gameRunning)
        return;

    const distance =
        player.position.distanceTo(
            ball.position
        );

    if(
        distance<2.2 ||
        ballOwner===player
    ){

        ballOwner=null;

        let teammate=null;

        let nearest=Infinity;

        blueTeam.forEach(
            mate=>{

                if(mate===player)
                    return;

                const d =
                    player.position
                    .distanceTo(
                        mate.position
                    );

                if(d<nearest){

                    nearest=d;
                    teammate=mate;
                }
            }
        );

        if(teammate){

            const direction =
                new THREE.Vector3()
                .subVectors(
                    teammate.position,
                    player.position
                );

            direction.y=0;

            direction.normalize();

            ballVelocity.copy(
                direction.multiplyScalar(
                    9
                )
            );

            ballVelocity.y=2;

            passes++;

            updateStats();
        }
    }
}

document.getElementById(
    "pass"
).addEventListener(
    "pointerdown",
    passBall
);


/* =====================================================
   TACKLE
===================================================== */

function tackle(){

    if(!gameRunning)
        return;

    let closest=null;
    let closestDistance=Infinity;

    redTeam.forEach(
        enemy=>{

            const d =
                player.position
                .distanceTo(
                    enemy.position
                );

            if(d<closestDistance){

                closestDistance=d;
                closest=enemy;
            }
        }
    );

    if(
        closest &&
        closestDistance<2
    ){

        const direction =
            new THREE.Vector3()
            .subVectors(
                closest.position,
                player.position
            );

        direction.y=0;

        if(direction.length()>0){

            direction.normalize();

            closest.position.add(
                direction.multiplyScalar(
                    .9
                )
            );
        }

        ballOwner=null;

        const away =
            closest.position
            .clone()
            .sub(player.position);

        away.y=0;

        if(away.length()>0){

            away.normalize();

            ballVelocity.copy(
                away.multiplyScalar(
                    6
                )
            );

            ballVelocity.y=2;
        }

        tackles++;

        updateStats();

        document.getElementById(
            "message"
        ).textContent=
            "Great tackle!";
    }
}

document.getElementById(
    "tackle"
).addEventListener(
    "pointerdown",
    tackle
);


/* =====================================================
   ENEMY AI
===================================================== */

function updateRedTeam(delta){

    redTeam.forEach(
        (enemy,index)=>{

            let target;

            if(index===0){

                target =
                    ball.position.clone();

            }else{

                target =
                    player.position.clone();

            }

            const direction =
                target.sub(
                    enemy.position
                );

            direction.y=0;

            const distance =
                direction.length();

            if(distance>1.8){

                direction.normalize();

                enemy.position.add(
                    direction.multiplyScalar(
                        1.8*delta
                    )
                );

                enemy.rotation.y=
                    Math.atan2(
                        direction.x,
                        direction.z
                    );
            }

            enemy.position.x=
                THREE.MathUtils.clamp(
                    enemy.position.x,
                    -11,
                    11
                );

            enemy.position.z=
                THREE.MathUtils.clamp(
                    enemy.position.z,
                    -17,
                    17
                );
        }
    );


    /* Red player can steal */

    redTeam.forEach(
        enemy=>{

            const d =
                enemy.position
                .distanceTo(
                    ball.position
                );

            if(
                d<1 &&
                !ballOwner
            ){

                ballOwner=enemy;
            }
        }
    );
}


/* =====================================================
   RED POSSESSION
===================================================== */

function updateRedPossession(){

    if(
        !ballOwner ||
        blueTeam.includes(ballOwner)
    )
        return;

    const direction =
        new THREE.Vector3(
            0,0,1
        );

    direction.applyQuaternion(
        ballOwner.quaternion
    );

    const target =
        ballOwner.position
        .clone()
        .add(
            direction.multiplyScalar(
                .8
            )
        );

    target.y=.35;

    ball.position.lerp(
        target,
        .3
    );

    /* Red player eventually shoots */

    if(
        ballOwner.position.z>10
    ){

        const shootDirection =
            new THREE.Vector3(
                0,0,1
            );

        shootDirection.applyQuaternion(
            ballOwner.quaternion
        );

        ballOwner=null;

        ballVelocity.copy(
            shootDirection.multiplyScalar(
                10
            )
        );

        ballVelocity.y=4;
    }
}


/* =====================================================
   GOALKEEPER
===================================================== */

function updateGoalkeeper(delta){

    const targetX =
        THREE.MathUtils.clamp(
            ball.position.x,
            -2.5,
            2.5
        );

    goalkeeper.position.x +=
        (
            targetX-
            goalkeeper.position.x
        ) *
        Math.min(
            delta*5,
            1
        );

    goalkeeper.position.z=
        -17.2;

    goalkeeper.lookAt(
        ball.position.x,
        1,
        ball.position.z
    );

    const distance =
        goalkeeper.position
        .distanceTo(
            ball.position
        );

    if(distance<1.3){

        ballOwner=null;

        const away =
            ball.position
            .clone()
            .sub(
                goalkeeper.position
            );

        away.y=0;

        if(away.length()>0){

            away.normalize();

            ballVelocity.x=
                away.x*9;

            ballVelocity.z=
                away.z*9;

            ballVelocity.y=4;
        }
    }
}


/* =====================================================
   BALL PHYSICS
===================================================== */

function updateBall(delta){

    if(ballOwner)
        return;

    ballVelocity.y -=
        12*delta;

    ball.position.add(
        ballVelocity
        .clone()
        .multiplyScalar(delta)
    );

    if(ball.position.y<.35){

        ball.position.y=.35;

        ballVelocity.y*= -.45;
    }

    ballVelocity.x *=
        Math.pow(
            .985,
            delta*60
        );

    ballVelocity.z *=
        Math.pow(
            .985,
            delta*60
        );


    /* Walls */

    if(ball.position.x>11.5){

        ball.position.x=11.5;

        ballVelocity.x*= -.7;
    }

    if(ball.position.x<-11.5){

        ball.position.x=-11.5;

        ballVelocity.x*= -.7;
    }
}


/* =====================================================
   GOALS
===================================================== */

function scoreGoal(team){

    ballOwner=null;

    if(team==="BLUE")
        blueScore++;
    else
        redScore++;

    updateScore();

    document.getElementById(
        "message"
    ).textContent=
        team+" GOAL!";

    ball.position.set(
        0,.35,0
    );

    ballVelocity.set(
        0,0,0
    );

    player.position.set(
        0,0,10
    );
}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

    gameRunning=false;

    joystickX=0;
    joystickY=0;

    sprinting=false;

    let result="DRAW";

    if(blueScore>redScore)
        result="YOU WIN!";

    if(blueScore<redScore)
        result="YOU LOSE!";

    document.getElementById(
        "result"
    ).textContent=result;

    document.getElementById(
        "finalScore"
    ).textContent=
        `BLUE ${blueScore} — ${redScore} RED`;

    document.getElementById(
        "finalStats"
    ).innerHTML=
        `Shots: ${shots}<br>
         Tackles: ${tackles}<br>
         Passes: ${passes}`;

    document.getElementById(
        "gameOver"
    ).style.display="flex";
}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    blueScore=0;
    redScore=0;

    shots=0;
    tackles=0;
    passes=0;

    timeLeft=90;

    timerAccumulator=0;

    gameRunning=true;

    activeIndex=0;

    player=blueTeam[0];

    updateScore();
    updateStats();
    updateTimer();
    updateActivePlayer();

    ballOwner=null;

    ball.position.set(
        0,.35,7
    );

    ballVelocity.set(
        0,0,0
    );


    bluePositions.forEach(
        (pos,i)=>{

            blueTeam[i]
            .position.set(
                pos[0],
                0,
                pos[1]
            );
        }
    );


    redPositions.forEach(
        (pos,i)=>{

            redTeam[i]
            .position.set(
                pos[0],
                0,
                pos[1]
            );
        }
    );


    goalkeeper.position.set(
        0,0,-17.2
    );

    document.getElementById(
        "message"
    ).textContent=
        "Move with the joystick";

    document.getElementById(
        "gameOver"
    ).style.display="none";
}

document.getElementById(
    "restart"
).addEventListener(
    "click",
    resetGame
);

document.getElementById(
    "playAgain"
).addEventListener(
    "click",
    resetGame
);


/* =====================================================
   MAIN LOOP
===================================================== */

const clock =
    new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );

    if(gameRunning){

        /* TIMER */

        timerAccumulator+=delta;

        if(timerAccumulator>=1){

            timerAccumulator=0;

            timeLeft--;

            updateTimer();

            if(timeLeft<=0){

                timeLeft=0;

                updateTimer();

                endGame();
            }
        }


        /* ACTIVE PLAYER */

        const speed =
            sprinting ? 11 : 7;

        player.position.x +=
            joystickX*
            speed*
            delta;

        player.position.z +=
            joystickY*
            speed*
            delta;

        player.position.x=
            THREE.MathUtils.clamp(
                player.position.x,
                -11,
                11
            );

        player.position.z=
            THREE.MathUtils.clamp(
                player.position.z,
                -17,
                17
            );


        /* ROTATION */

        if(
            Math.abs(joystickX)>.1 ||
            Math.abs(joystickY)>.1
        ){

            player.rotation.y=
                Math.atan2(
                    joystickX,
                    joystickY
                );
        }


        /* BALL CONTROL */

        tryTakeBall();

        updatePossession();

        updateRedPossession();

        updateBall(delta);


        /* AI */

        updateRedTeam(delta);

        updateGoalkeeper(delta);


        /* GOALS */

        if(
            ball.position.z < -18.5 &&
            Math.abs(ball.position.x)<3
        ){

            scoreGoal("BLUE");
        }

        if(
            ball.position.z > 18.5 &&
            Math.abs(ball.position.x)<3
        ){

            scoreGoal("RED");
        }
    }


    /* =================================================
       CAMERA
    ================================================= */

    const offset =
        new THREE.Vector3(
            0,
            8,
            10
        );

    offset.applyQuaternion(
        player.quaternion
    );

    const cameraTarget =
        player.position
        .clone()
        .add(offset);

    camera.position.lerp(
        cameraTarget,
        .1
    );

    camera.lookAt(
        player.position.x,
        .5,
        player.position.z-3
    );


    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =====================================================
   START
===================================================== */

resetGame();

animate();

</script>
