<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Football V5</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  touch-action:none;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  top:8px;
  left:0;
  width:100%;
  text-align:center;
  color:white;
  z-index:20;
  pointer-events:none;
  text-shadow:0 2px 4px #000;
}

#score{
  font-size:23px;
  font-weight:bold;
}

#timer{
  font-size:17px;
  margin-top:3px;
}

#message{
  font-size:13px;
  margin-top:3px;
}

#powerBox{
  position:fixed;
  right:25px;
  bottom:158px;
  width:115px;
  height:9px;
  background:rgba(255,255,255,.25);
  border-radius:10px;
  overflow:hidden;
  z-index:30;
  display:none;
}

#power{
  width:0%;
  height:100%;
  background:#fff;
}

#joystick{
  position:fixed;
  left:22px;
  bottom:25px;
  width:128px;
  height:128px;
  border-radius:50%;
  background:rgba(255,255,255,.14);
  border:3px solid rgba(255,255,255,.38);
  z-index:30;
}

#stick{
  position:absolute;
  width:58px;
  height:58px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(255,255,255,.75);
  border:3px solid white;
}

#buttons{
  position:fixed;
  right:14px;
  bottom:18px;
  display:grid;
  grid-template-columns:78px 78px;
  gap:9px;
  z-index:30;
}

button{
  width:78px;
  height:54px;
  border-radius:15px;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(15,15,15,.72);
  color:white;
  font-size:11px;
  font-weight:bold;
}

button:active{
  transform:scale(.91);
}

#shoot{
  background:rgba(190,20,20,.82);
}

#pass{
  background:rgba(0,95,210,.82);
}

#sprint{
  background:rgba(0,120,55,.82);
}

#defend{
  background:rgba(100,70,0,.85);
}

#menu,#gameover{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.88);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

#gameover{
  display:none;
}

h1{
  margin:0 0 10px;
  font-size:40px;
}

.sub{
  color:#bbb;
  margin:5px 25px 25px;
}

.bigButton{
  width:220px;
  height:60px;
  font-size:17px;
  background:#087d28;
}
</style>
</head>

<body>

<div id="menu">
  <h1>⚽ FOOTBALL V5</h1>
  <div class="sub">
    eFootball-inspired mobile gameplay
  </div>
  <button class="bigButton" id="start">START MATCH</button>
</div>

<div id="gameover">
  <h1 id="result">FULL TIME</h1>
  <div id="finalScore"></div>
  <br>
  <button class="bigButton" onclick="location.reload()">PLAY AGAIN</button>
</div>

<div id="hud">
  <div id="score">BLUE 0 - 0 RED</div>
  <div id="timer">02:00</div>
  <div id="message">Get the ball</div>
</div>

<div id="powerBox">
  <div id="power"></div>
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="buttons">
  <button id="pass">PASS</button>
  <button id="shoot">SHOOT</button>
  <button id="sprint">SPRINT</button>
  <button id="defend">PRESS</button>
  <button id="switch">SWITCH</button>
  <button id="through">THROUGH</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* ============================================================
   SCENE
============================================================ */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x6bb6ee);

const camera = new THREE.PerspectiveCamera(
  65,
  innerWidth/innerHeight,
  .1,
  250
);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;

document.body.appendChild(renderer.domElement);


/* ============================================================
   LIGHT
============================================================ */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x345f30,
    1.4
  )
);

const sun=new THREE.DirectionalLight(
  0xffffff,
  1.1
);

sun.position.set(15,30,10);
sun.castShadow=true;

scene.add(sun);


/* ============================================================
   PITCH
============================================================ */

const pitch=new THREE.Mesh(
  new THREE.BoxGeometry(30,.2,52),
  new THREE.MeshStandardMaterial({
    color:0x148332
  })
);

pitch.position.y=-.1;
pitch.receiveShadow=true;

scene.add(pitch);


/* ============================================================
   FIELD LINES
============================================================ */

function fieldLine(x1,z1,x2,z2){

  const geometry=new THREE.BufferGeometry()
    .setFromPoints([
      new THREE.Vector3(x1,.025,z1),
      new THREE.Vector3(x2,.025,z2)
    ]);

  scene.add(
    new THREE.Line(
      geometry,
      new THREE.LineBasicMaterial({
        color:0xffffff
      })
    )
  );
}

fieldLine(-15,-26,15,-26);
fieldLine(15,-26,15,26);
fieldLine(15,26,-15,26);
fieldLine(-15,26,-15,-26);
fieldLine(-15,0,15,0);

const centreCircle=new THREE.Mesh(
  new THREE.RingGeometry(4.5,4.58,64),
  new THREE.MeshBasicMaterial({
    color:0xffffff,
    side:THREE.DoubleSide
  })
);

centreCircle.rotation.x=-Math.PI/2;
centreCircle.position.y=.03;

scene.add(centreCircle);


/* ============================================================
   PENALTY AREAS
============================================================ */

function rectangleLines(z){

  const sign=z<0?-1:1;
  const edge=z+sign*5;

  fieldLine(-7,z,7,z);
  fieldLine(-7,z,-7,edge);
  fieldLine(7,z,7,edge);
  fieldLine(-7,edge,7,edge);
}

rectangleLines(-26);
rectangleLines(26);


/* ============================================================
   GOALS
============================================================ */

function createGoal(z){

  const group=new THREE.Group();

  const material=new THREE.MeshStandardMaterial({
    color:0xffffff
  });

  const post1=new THREE.Mesh(
    new THREE.BoxGeometry(.25,3.2,.25),
    material
  );

  const post2=post1.clone();

  const cross=new THREE.Mesh(
    new THREE.BoxGeometry(7,.25,.25),
    material
  );

  post1.position.set(-3.5,1.6,0);
  post2.position.set(3.5,1.6,0);
  cross.position.set(0,3.2,0);

  group.add(post1,post2,cross);

  group.position.z=z;

  scene.add(group);
}

createGoal(-26);
createGoal(26);


/* ============================================================
   PLAYER
============================================================ */

function createPlayer(color){

  const group=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.CapsuleGeometry(.48,.9,6,10),
    new THREE.MeshStandardMaterial({
      color
    })
  );

  body.position.y=1;
  body.castShadow=true;

  group.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.29,12,12),
    new THREE.MeshStandardMaterial({
      color:0xffc79c
    })
  );

  head.position.y=2;
  head.castShadow=true;

  group.add(head);

  return group;
}


/* ============================================================
   TEAMS
============================================================ */

const blue=[];
const red=[];

const blueStart=[
  [0,16],
  [-9,10],
  [9,10],
  [-7,3],
  [7,3],
  [0,-4],
  [-4,-10],
  [4,-10],
  [0,-17]
];

const redStart=[
  [0,-16],
  [-9,-10],
  [9,-10],
  [-7,-3],
  [7,-3],
  [0,4],
  [-4,10],
  [4,10],
  [0,17]
];

for(const p of blueStart){

  const player=createPlayer(0x0874ff);

  player.position.set(p[0],0,p[1]);

  scene.add(player);
  blue.push(player);
}

for(const p of redStart){

  const player=createPlayer(0xe52323);

  player.position.set(p[0],0,p[1]);

  scene.add(player);
  red.push(player);
}


/* ============================================================
   BALL
============================================================ */

const ball=new THREE.Mesh(
  new THREE.SphereGeometry(.38,20,20),
  new THREE.MeshStandardMaterial({
    color:0xffffff
  })
);

ball.castShadow=true;
ball.position.set(0,.4,0);

scene.add(ball);


/* ============================================================
   GAME STATE
============================================================ */

let controlled=blue[8];

let ballOwner=null;

let blueScore=0;
let redScore=0;

let timeLeft=120;

let running=false;

let sprint=false;

let joystickX=0;
let joystickY=0;

let shootCharging=false;
let shootPower=0;

let passCooldown=0;

let lastTime=performance.now();


/* ============================================================
   JOYSTICK
============================================================ */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyDown=false;

function joystickMove(x,y){

  const r=joystick.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=48;

  const d=Math.sqrt(dx*dx+dy*dy);

  if(d>max){

    dx=dx/d*max;
    dy=dy/d*max;

  }

  joystickX=dx/max;
  joystickY=dy/max;

  stick.style.left=`calc(50% + ${dx}px)`;
  stick.style.top=`calc(50% + ${dy}px)`;
}

function joystickReset(){

  joyDown=false;

  joystickX=0;
  joystickY=0;

  stick.style.left="50%";
  stick.style.top="50%";
}

joystick.addEventListener("pointerdown",e=>{

  e.preventDefault();

  joyDown=true;

  joystick.setPointerCapture(e.pointerId);

  joystickMove(e.clientX,e.clientY);
});

joystick.addEventListener("pointermove",e=>{

  if(joyDown){

    joystickMove(e.clientX,e.clientY);

  }
});

joystick.addEventListener("pointerup",joystickReset);
joystick.addEventListener("pointercancel",joystickReset);


/* ============================================================
   FIND BALL CARRIER
============================================================ */

function nearestBlueToBall(){

  let best=null;
  let distance=Infinity;

  for(const p of blue){

    const d=p.position.distanceTo(ball.position);

    if(d<distance){

      distance=d;
      best=p;

    }
  }

  return best;
}


/* ============================================================
   TAKE BALL
============================================================ */

function pickupBall(){

  if(ballOwner) return;

  for(const p of blue){

    if(
      p.position.distanceTo(ball.position)<1.25
    ){

      ballOwner=p;
      controlled=p;

      message("⚽ BALL");

      return;
    }
  }

  for(const p of red){

    if(
      p.position.distanceTo(ball.position)<1.05
    ){

      ballOwner=p;

      return;
    }
  }
}


/* ============================================================
   BALL CARRIER MOVEMENT
============================================================ */

function moveControlled(dt){

  if(!running) return;

  if(!controlled) return;

  const magnitude=Math.sqrt(
    joystickX*joystickX+
    joystickY*joystickY
  );

  if(magnitude<.05) return;

  let speed=.085;

  if(sprint) speed=.14;

  if(ballOwner===controlled){

    speed*=.88;

  }

  controlled.position.x +=
    joystickX*speed;

  controlled.position.z +=
    joystickY*speed;

  controlled.position.x=
    THREE.MathUtils.clamp(
      controlled.position.x,
      -13.5,
      13.5
    );

  controlled.position.z=
    THREE.MathUtils.clamp(
      controlled.position.z,
      -24,
      24
    );

  controlled.rotation.y=
    Math.atan2(
      joystickX,
      joystickY
    );
}


/* ============================================================
   DRIBBLE BALL
============================================================ */

function updateDribble(){

  if(!ballOwner) return;

  if(!blue.includes(ballOwner)) return;

  const owner=ballOwner;

  const forward=new THREE.Vector3(
    0,0,-1
  );

  forward.applyQuaternion(
    owner.quaternion
  );

  const target=
    owner.position.clone()
      .add(forward.multiplyScalar(.9));

  target.y=.38;

  ball.position.lerp(
    target,
    .45
  );
}


/* ============================================================
   DIRECTION
============================================================ */

function movementDirection(){

  const v=new THREE.Vector3(
    joystickX,
    0,
    joystickY
  );

  if(v.length()<.05){

    v.set(
      0,
      0,
      -1
    );

    v.applyQuaternion(
      controlled.quaternion
    );
  }

  return v.normalize();
}


/* ============================================================
   PASS
============================================================ */

function passBall(){

  if(!running) return;

  if(!ballOwner) return;

  if(!blue.includes(ballOwner)) return;

  if(passCooldown>0) return;

  passCooldown=.4;

  const passer=ballOwner;

  const direction=movementDirection();

  let best=null;
  let bestScore=-Infinity;

  for(const teammate of blue){

    if(teammate===passer) continue;

    const to=
      teammate.position.clone()
      .sub(passer.position);

    const distance=to.length();

    if(distance<1 || distance>18) continue;

    to.normalize();

    const alignment=
      direction.dot(to);

    const score=
      alignment*5-distance*.1;

    if(score>bestScore){

      bestScore=score;
      best=teammate;

    }
  }

  if(!best){

    best=blue.find(p=>p!==passer);

  }

  if(!best) return;

  const start=ball.position.clone();

  const target=best.position.clone();

  target.y=.45;

  ballOwner=null;

  let t=0;

  message("PASS");

  function animatePass(){

    if(!running) return;

    t+=.055;

    const pos=start.clone().lerp(
      target,
      Math.min(t,1)
    );

    pos.y=.4+
      Math.sin(Math.min(t,1)*Math.PI)*.7;

    ball.position.copy(pos);

    if(t<1){

      requestAnimationFrame(animatePass);

    }else{

      ballOwner=best;

      controlled=best;

      message("⚽ RECEIVED");

    }
  }

  animatePass();
}


/* ============================================================
   THROUGH BALL
============================================================ */

function throughBall(){

  if(!running) return;

  if(ballOwner!==controlled) return;

  const direction=movementDirection();

  const start=ball.position.clone();

  const target=
    controlled.position.clone()
      .add(direction.multiplyScalar(9));

  target.x=
    THREE.MathUtils.clamp(
      target.x,
      -13,
      13
    );

  target.z=
    THREE.MathUtils.clamp(
      target.z,
      -24,
      24
    );

  target.y=.35;

  ballOwner=null;

  let t=0;

  message("THROUGH BALL");

  function animateThrough(){

    t+=.05;

    ball.position.lerpVectors(
      start,
      target,
      Math.min(t,1)
    );

    ball.position.y=
      .35+
      Math.sin(Math.min(t,1)*Math.PI)*.35;

    if(t<1){

      requestAnimationFrame(animateThrough);

    }else{

      pickupBall();

    }
  }

  animateThrough();
}


/* ============================================================
   SHOOT
============================================================ */

function startShoot(){

  if(!running) return;

  if(ballOwner!==controlled) return;

  shootCharging=true;
  shootPower=0;

  document.getElementById("powerBox").style.display="block";
}

function updateShootPower(){

  if(!shootCharging) return;

  shootPower+=.025;

  shootPower=
    Math.min(
      shootPower,
      1
    );

  document.getElementById("power").style.width=
    `${shootPower*100}%`;
}

function releaseShoot(){

  if(!shootCharging) return;

  shootCharging=false;

  document.getElementById("powerBox").style.display="none";

  if(ballOwner!==controlled) return;

  const power=
    Math.max(
      .25,
      shootPower
    );

  const shooter=controlled;

  const direction=movementDirection();

  /*
    If player isn't aiming,
    shoot toward opponent goal.
  */

  if(Math.abs(joystickX)<.08 &&
     Math.abs(joystickY)<.08){

    direction.set(
      0,
      0,
      -1
    );

  }

  const distance=
    9+power*14;

  const target=
    shooter.position.clone()
      .add(direction.multiplyScalar(distance));

  target.y=.4;

  ballOwner=null;

  let t=0;

  message("🔥 SHOOT");

  function animateShot(){

    t+=.045;

    const pos=
      ball.position.clone()
        .lerp(target,Math.min(t,1));

    pos.y=
      .4+
      Math.sin(Math.min(t,1)*Math.PI)
      *(1.5+power*2.5);

    ball.position.copy(pos);

    if(t<1){

      requestAnimationFrame(animateShot);

    }else{

      checkGoalOrReset(shooter);

    }
  }

  animateShot();
}


/* ============================================================
   GOAL CHECK
============================================================ */

function checkGoalOrReset(shooter){

  /*
    Blue attacks negative Z.
  */

  if(
    ball.position.z<-25 &&
    Math.abs(ball.position.x)<3.5
  ){

    blueScore++;

    updateScore();

    message("⚽⚽ GOAL BLUE!");

    resetKickoff();

    return;
  }

  if(
    ball.position.z>25 &&
    Math.abs(ball.position.x)<3.5
  ){

    redScore++;

    updateScore();

    message("RED GOAL");

    resetKickoff();

    return;
  }

  /*
    Missed shot.
  */

  ball.position.y=.4;

  pickupBall();
}


/* ============================================================
   RED AI
============================================================ */

function redAI(dt){

  if(!running) return;

  for(const p of red){

    /*
      Ball carrier attacks blue goal.
    */

    if(ballOwner===p){

      const target=
        new THREE.Vector3(
          0,
          0,
          -25
        );

      const direction=
        target.clone()
          .sub(p.position)
          .normalize();

      p.position.add(
        direction.multiplyScalar(.045)
      );

      p.rotation.y=
        Math.atan2(
          direction.x,
          direction.z
        );

      ball.position.set(
        p.position.x,
        .4,
        p.position.z+.8
      );

      /*
        Red can shoot near goal.
      */

      if(p.position.z<-21){

        ballOwner=null;

        const targetGoal=
          new THREE.Vector3(
            (Math.random()-.5)*5,
            .5,
            -27
          );

        ball.position.lerp(
          targetGoal,
          .7
        );

      }

      continue;
    }

    /*
      Defend or chase ball.
    */

    let target;

    if(ballOwner &&
       blue.includes(ballOwner)){

      target=ballOwner.position;

    }else{

      target=ball.position;

    }

    const distance=
      p.position.distanceTo(target);

    const direction=
      target.clone()
        .sub(p.position)
        .normalize();

    let speed=.025;

    if(distance<8) speed=.04;

    p.position.add(
      direction.multiplyScalar(speed)
    );

    p.rotation.y=
      Math.atan2(
        direction.x,
        direction.z
      );

    /*
      Steal ball.
    */

    if(
      ballOwner &&
      blue.includes(ballOwner) &&
      p.position.distanceTo(ballOwner.position)<.9
    ){

      ballOwner=p;

      message("⚠️ BALL LOST");

    }

    /*
      Pick up loose ball.
    */

    if(
      !ballOwner &&
      p.position.distanceTo(ball.position)<.9
    ){

      ballOwner=p;

    }
  }
}


/* ============================================================
   BLUE TEAM AI
============================================================ */

function blueAI(){

  if(!running) return;

  for(const p of blue){

    if(p===controlled) continue;

    /*
      Ball carrier stays controlled.
    */

    if(p===ballOwner) continue;

    /*
      Teammates move into useful positions.
    */

    const target=p.position.clone();

    const index=blue.indexOf(p);

    /*
      Move toward ball when reasonably close.
    */

    if(
      ballOwner &&
      red.includes(ballOwner)
    ){

      target.lerp(
        ballOwner.position,
        .025
      );

    }else{

      /*
        Formation positioning.
      */

      const formation=blueStart[index];

      target.x=
        formation[0];

      target.z=
        formation[1];

    }

    p.position.x +=
      (target.x-p.position.x)*.012;

    p.position.z +=
      (target.z-p.position.z)*.012;
  }
}


/* ============================================================
   PRESS / DEFEND
============================================================ */

function defend(){

  if(!running) return;

  const p=controlled;

  let nearest=null;
  let distance=Infinity;

  for(const enemy of red){

    const d=
      enemy.position.distanceTo(p.position);

    if(d<distance){

      distance=d;
      nearest=enemy;

    }
  }

  if(
    nearest &&
    distance<2
  ){

    const direction=
      nearest.position.clone()
        .sub(p.position)
        .normalize();

    nearest.position.add(
      direction.multiplyScalar(.8)
    );

    if(ballOwner===nearest){

      ballOwner=p;

      controlled=p;

      message("🔥 BALL WON!");

    }

  }
}


/* ============================================================
   SWITCH
============================================================ */

function switchPlayer(){

  if(!running) return;

  /*
    If blue has ball,
    keep control on ball carrier.
  */

  if(
    ballOwner &&
    blue.includes(ballOwner)
  ){

    controlled=ballOwner;

    message("BALL CARRIER");

    return;
  }

  /*
    Otherwise choose blue player
    closest to the ball.
  */

  let best=null;
  let distance=Infinity;

  for(const p of blue){

    const d=
      p.position.distanceTo(ball.position);

    if(d<distance){

      distance=d;
      best=p;

    }
  }

  if(best){

    controlled=best;

    message("PLAYER SWITCH");

  }
}


/* ============================================================
   CAMERA
============================================================ */

function updateCamera(){

  if(!controlled) return;

  /*
    Camera follows the controlled player.
    Joystick does NOT rotate the camera.
  */

  const offset=new THREE.Vector3(
    0,
    8,
    10
  );

  offset.applyQuaternion(
    controlled.quaternion
  );

  const desired=
    controlled.position.clone()
      .add(offset);

  camera.position.lerp(
    desired,
    .08
  );

  const look=
    controlled.position.clone();

  look.y=.8;

  look.z-=3;

  camera.lookAt(look);
}


/* ============================================================
   KICKOFF
============================================================ */

function resetKickoff(){

  ballOwner=null;

  ball.position.set(
    0,
    .4,
    0
  );

  for(let i=0;i<blue.length;i++){

    blue[i].position.set(
      blueStart[i][0],
      0,
      blueStart[i][1]
    );

  }

  for(let i=0;i<red.length;i++){

    red[i].position.set(
      redStart[i][0],
      0,
      redStart[i][1]
    );

  }

  controlled=blue[8];

  setTimeout(()=>{

    if(running){

      message("KICK OFF");

    }

  },700);
}


/* ============================================================
   HUD
============================================================ */

function updateScore(){

  document.getElementById("score").textContent=
    `BLUE ${blueScore} - ${redScore} RED`;
}

function message(text){

  document.getElementById("message").textContent=text;
}


/* ============================================================
   BUTTONS
============================================================ */

document.getElementById("pass")
.addEventListener("pointerdown",e=>{
  e.preventDefault();
  passBall();
});

document.getElementById("through")
.addEventListener("pointerdown",e=>{
  e.preventDefault();
  throughBall();
});

document.getElementById("switch")
.addEventListener("pointerdown",e=>{
  e.preventDefault();
  switchPlayer();
});

document.getElementById("defend")
.addEventListener("pointerdown",e=>{
  e.preventDefault();
  defend();
});


/* SPRINT */

document.getElementById("sprint")
.addEventListener("pointerdown",e=>{
  e.preventDefault();
  sprint=true;
});

document.getElementById("sprint")
.addEventListener("pointerup",()=>{
  sprint=false;
});

document.getElementById("sprint")
.addEventListener("pointercancel",()=>{
  sprint=false;
});

document.getElementById("sprint")
.addEventListener("pointerleave",()=>{
  sprint=false;
});


/* SHOOT */

const shootButton=
  document.getElementById("shoot");

shootButton.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    startShoot();
  }
);

shootButton.addEventListener(
  "pointerup",
  e=>{
    e.preventDefault();
    releaseShoot();
  }
);

shootButton.addEventListener(
  "pointercancel",
  releaseShoot
);


/* ============================================================
   START
============================================================ */

document.getElementById("start")
.addEventListener("click",()=>{

  document.getElementById("menu").style.display="none";

  running=true;

  resetKickoff();

  startTimer();
});


/* ============================================================
   TIMER
============================================================ */

function startTimer(){

  setInterval(()=>{

    if(!running) return;

    timeLeft--;

    const min=
      Math.floor(timeLeft/60)
      .toString()
      .padStart(2,"0");

    const sec=
      (timeLeft%60)
      .toString()
      .padStart(2,"0");

    document.getElementById("timer").textContent=
      `${min}:${sec}`;

    if(timeLeft<=0){

      running=false;

      showGameOver();

    }

  },1000);
}


/* ============================================================
   GAME OVER
============================================================ */

function showGameOver(){

  let text="DRAW";

  if(blueScore>redScore){

    text="🏆 BLUE WIN";

  }else if(redScore>blueScore){

    text="🔴 RED WIN";

  }

  document.getElementById("result").textContent=text;

  document.getElementById("finalScore").textContent=
    `BLUE ${blueScore} - ${redScore} RED`;

  document.getElementById("gameover").style.display="flex";
}


/* ============================================================
   MAIN LOOP
============================================================ */

function animate(){

  requestAnimationFrame(animate);

  const now=performance.now();

  const dt=Math.min(
    (now-lastTime)/16.67,
    2
  );

  lastTime=now;

  if(running){

    moveControlled(dt);

    updateShootPower();

    pickupBall();

    updateDribble();

    redAI(dt);

    blueAI();

    if(passCooldown>0){

      passCooldown-=.016;

    }

  }

  updateCamera();

  renderer.render(
    scene,
    camera
  );
}

animate();


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener("resize",()=>{

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );
});

</script>
