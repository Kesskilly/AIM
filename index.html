<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Football Game V4</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
}

body{
  margin:0;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  top:10px;
  left:0;
  width:100%;
  z-index:10;
  text-align:center;
  color:white;
  pointer-events:none;
}

#score{
  font-size:24px;
  font-weight:bold;
  text-shadow:0 2px 4px #000;
}

#timer{
  margin-top:4px;
  font-size:18px;
  font-weight:bold;
  text-shadow:0 2px 4px #000;
}

#status{
  margin-top:3px;
  font-size:13px;
}

#joystick{
  position:fixed;
  left:25px;
  bottom:30px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  border:3px solid rgba(255,255,255,.4);
  z-index:20;
}

#stick{
  position:absolute;
  width:58px;
  height:58px;
  border-radius:50%;
  background:rgba(255,255,255,.75);
  border:3px solid white;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

.buttons{
  position:fixed;
  right:18px;
  bottom:20px;
  z-index:20;
  display:grid;
  grid-template-columns:75px 75px;
  gap:10px;
}

button{
  width:75px;
  height:55px;
  border:0;
  border-radius:14px;
  background:rgba(20,20,20,.72);
  color:white;
  font-weight:bold;
  font-size:12px;
  border:2px solid rgba(255,255,255,.35);
}

button:active{
  transform:scale(.92);
  background:#333;
}

#sprint{
  background:rgba(0,110,255,.75);
}

#shoot{
  background:rgba(220,30,30,.8);
}

#menu{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
  text-align:center;
}

#menu h1{
  font-size:42px;
  margin:0 0 10px;
}

#menu p{
  color:#bbb;
  margin-bottom:25px;
}

#start{
  width:220px;
  height:60px;
  font-size:18px;
  background:#087f23;
}

#gameover{
  position:fixed;
  inset:0;
  z-index:90;
  background:rgba(0,0,0,.75);
  color:white;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

#gameover h1{
  font-size:38px;
  margin:0 0 15px;
}

#restart{
  width:180px;
  height:55px;
  background:#087f23;
  font-size:17px;
}
</style>
</head>

<body>

<div id="menu">
  <h1>⚽ FOOTBALL V4</h1>
  <p>Control the player with the ball</p>
  <button id="start">START MATCH</button>
</div>

<div id="hud">
  <div id="score">BLUE 0 - 0 RED</div>
  <div id="timer">01:30</div>
  <div id="status">Get the ball!</div>
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div class="buttons">
  <button id="pass">PASS</button>
  <button id="shoot">SHOOT</button>
  <button id="tackle">TACKLE</button>
  <button id="switch">SWITCH</button>
  <button id="sprint">SPRINT</button>
</div>

<div id="gameover">
  <h1 id="result">FULL TIME</h1>
  <p id="finalScore"></p>
  <button id="restart">PLAY AGAIN</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   BASIC SETUP
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x65aee8);

const camera = new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,
  .1,
  300
);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);


/* =========================================================
   LIGHTS
========================================================= */

const ambient = new THREE.AmbientLight(0xffffff,.65);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff,1);
sun.position.set(10,25,10);
sun.castShadow = true;

scene.add(sun);


/* =========================================================
   FIELD
========================================================= */

const field = new THREE.Mesh(
  new THREE.BoxGeometry(24,.2,38),
  new THREE.MeshStandardMaterial({
    color:0x168a35
  })
);

field.position.y = -.1;
field.receiveShadow = true;

scene.add(field);


/* =========================================================
   FIELD LINES
========================================================= */

function line(x1,z1,x2,z2){

  const points = [
    new THREE.Vector3(x1,.02,z1),
    new THREE.Vector3(x2,.02,z2)
  ];

  const geo = new THREE.BufferGeometry()
    .setFromPoints(points);

  const mat = new THREE.LineBasicMaterial({
    color:0xffffff
  });

  scene.add(new THREE.Line(geo,mat));
}

line(-12,-19,12,-19);
line(12,-19,12,19);
line(12,19,-12,19);
line(-12,19,-12,-19);

line(-12,0,12,0);

const circle = new THREE.Mesh(
  new THREE.RingGeometry(3.5,3.55,64),
  new THREE.MeshBasicMaterial({
    color:0xffffff,
    side:THREE.DoubleSide
  })
);

circle.rotation.x = -Math.PI/2;
circle.position.y=.025;

scene.add(circle);


/* =========================================================
   GOALS
========================================================= */

function createGoal(z){

  const group = new THREE.Group();

  const postMat = new THREE.MeshStandardMaterial({
    color:0xffffff
  });

  const post1 = new THREE.Mesh(
    new THREE.BoxGeometry(.3,3,.3),
    postMat
  );

  const post2 = post1.clone();

  const bar = new THREE.Mesh(
    new THREE.BoxGeometry(7,.3,.3),
    postMat
  );

  post1.position.set(-3.5,1.5,0);
  post2.position.set(3.5,1.5,0);
  bar.position.set(0,3,0);

  group.add(post1,post2,bar);

  group.position.z=z;

  scene.add(group);
}

createGoal(-19);
createGoal(19);


/* =========================================================
   PLAYER CREATION
========================================================= */

function createPlayer(color){

  const group = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(.45,1,6,10),
    new THREE.MeshStandardMaterial({
      color:color
    })
  );

  body.position.y=1;

  body.castShadow=true;

  group.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(.28,12,12),
    new THREE.MeshStandardMaterial({
      color:0xffc79c
    })
  );

  head.position.y=2;

  head.castShadow=true;

  group.add(head);

  return group;
}


/* =========================================================
   TEAMS
========================================================= */

const blueTeam=[];
const redTeam=[];

const bluePositions=[
  [0,10],
  [-7,6],
  [7,6],
  [-5,1],
  [5,1],
  [0,-4]
];

const redPositions=[
  [0,-10],
  [-7,-6],
  [7,-6],
  [-5,-1],
  [5,-1],
  [0,5]
];

for(let p of bluePositions){

  const player=createPlayer(0x006eff);

  player.position.set(p[0],0,p[1]);

  scene.add(player);

  blueTeam.push(player);
}

for(let p of redPositions){

  const player=createPlayer(0xe52323);

  player.position.set(p[0],0,p[1]);

  scene.add(player);

  redTeam.push(player);
}


/* =========================================================
   BALL
========================================================= */

const ball = new THREE.Mesh(
  new THREE.SphereGeometry(.38,20,20),
  new THREE.MeshStandardMaterial({
    color:0xffffff
  })
);

ball.position.set(0,.45,7);
ball.castShadow=true;

scene.add(ball);


/* =========================================================
   GAME VARIABLES
========================================================= */

let controlledPlayer = blueTeam[5];

let ballOwner = null;

let scoreBlue=0;
let scoreRed=0;

let matchTime=90;

let gameRunning=false;

let sprinting=false;

let joystickX=0;
let joystickY=0;

let shots=0;
let passes=0;
let tackles=0;


/* =========================================================
   JOYSTICK
========================================================= */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joystickActive=false;

function setJoystick(clientX,clientY){

  const rect=joystick.getBoundingClientRect();

  const centerX=rect.left+rect.width/2;
  const centerY=rect.top+rect.height/2;

  let dx=clientX-centerX;
  let dy=clientY-centerY;

  const max=48;

  const distance=Math.sqrt(dx*dx+dy*dy);

  if(distance>max){

    dx=dx/distance*max;
    dy=dy/distance*max;
  }

  joystickX=dx/max;
  joystickY=dy/max;

  stick.style.left=
    `calc(50% + ${dx}px)`;

  stick.style.top=
    `calc(50% + ${dy}px)`;
}

function resetJoystick(){

  joystickActive=false;

  joystickX=0;
  joystickY=0;

  stick.style.left="50%";
  stick.style.top="50%";
}

joystick.addEventListener("pointerdown",e=>{

  joystickActive=true;

  joystick.setPointerCapture(e.pointerId);

  setJoystick(e.clientX,e.clientY);

});

joystick.addEventListener("pointermove",e=>{

  if(joystickActive){

    setJoystick(e.clientX,e.clientY);

  }

});

joystick.addEventListener("pointerup",resetJoystick);
joystick.addEventListener("pointercancel",resetJoystick);


/* =========================================================
   CONTROLLED PLAYER
========================================================= */

function controlBallOwner(){

  if(
    ballOwner &&
    blueTeam.includes(ballOwner)
  ){

    controlledPlayer=ballOwner;

  }
}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function moveControlledPlayer(){

  if(!gameRunning) return;

  if(!controlledPlayer) return;

  const length=Math.sqrt(
    joystickX*joystickX+
    joystickY*joystickY
  );

  if(length<.05) return;

  let speed=sprinting ? .17 : .09;

  /*
    IMPORTANT:

    The joystick moves ONLY the controlled player.

    It does NOT move the camera.
    The camera follows the player separately.
  */

  controlledPlayer.position.x += joystickX*speed;
  controlledPlayer.position.z += joystickY*speed;

  controlledPlayer.position.x=
    THREE.MathUtils.clamp(
      controlledPlayer.position.x,
      -11.3,
      11.3
    );

  controlledPlayer.position.z=
    THREE.MathUtils.clamp(
      controlledPlayer.position.z,
      -17.5,
      17.5
    );

  /*
    Rotate player toward movement.
  */

  controlledPlayer.rotation.y=
    Math.atan2(
      joystickX,
      joystickY
    );

}


/* =========================================================
   BALL POSSESSION
========================================================= */

function checkBallPickup(){

  if(ballOwner) return;

  for(const p of blueTeam){

    const distance=
      p.position.distanceTo(ball.position);

    if(distance<1.35){

      ballOwner=p;

      controlledPlayer=p;

      document.getElementById("status").textContent=
        "⚽ YOU HAVE THE BALL";

      return;
    }
  }
}


/* =========================================================
   KEEP BALL IN FRONT OF PLAYER
========================================================= */

function updateBall(){

  if(!ballOwner) return;

  const forward=new THREE.Vector3(
    0,
    0,
    -1
  );

  forward.applyQuaternion(
    ballOwner.quaternion
  );

  ball.position.copy(
    ballOwner.position
  );

  ball.position.y=.42;

  ball.position.add(
    forward.multiplyScalar(.9)
  );

}


/* =========================================================
   PASS
========================================================= */

function passBall(){

  if(!gameRunning) return;

  if(!ballOwner) return;

  if(!blueTeam.includes(ballOwner)) return;

  let nearest=null;
  let best=Infinity;

  for(const teammate of blueTeam){

    if(teammate===ballOwner) continue;

    const d=
      teammate.position.distanceTo(
        ballOwner.position
      );

    if(d<best){

      best=d;
      nearest=teammate;

    }
  }

  if(!nearest) return;

  passes++;

  ballOwner=null;

  const direction=
    new THREE.Vector3()
      .subVectors(
        nearest.position,
        controlledPlayer.position
      )
      .normalize();

  ball.position.copy(
    controlledPlayer.position
  );

  ball.position.y=.45;

  /*
    Move ball toward teammate.
  */

  const start=ball.position.clone();

  const target=nearest.position.clone();

  let progress=0;

  function animatePass(){

    if(!gameRunning) return;

    progress+=.045;

    const pos=start.clone().lerp(
      target,
      progress
    );

    pos.y=.45+
      Math.sin(progress*Math.PI)*2;

    ball.position.copy(pos);

    if(progress<1){

      requestAnimationFrame(animatePass);

    }else{

      ballOwner=nearest;

      controlledPlayer=nearest;

      document.getElementById("status").textContent=
        "⚽ PASS RECEIVED";

    }
  }

  animatePass();
}


/* =========================================================
   SHOOT
========================================================= */

function shoot(){

  if(!gameRunning) return;

  if(!ballOwner) return;

  if(!blueTeam.includes(ballOwner)) return;

  shots++;

  const shooter=ballOwner;

  ballOwner=null;

  const targetZ=-20;

  const start=ball.position.clone();

  const target=new THREE.Vector3(
    shooter.position.x,
    .5,
    targetZ
  );

  let progress=0;

  document.getElementById("status").textContent=
    "🔥 SHOT!";

  function animateShot(){

    if(!gameRunning) return;

    progress+=.035;

    const pos=start.clone().lerp(
      target,
      progress
    );

    pos.y=.45+
      Math.sin(progress*Math.PI)*3;

    ball.position.copy(pos);

    if(progress<1){

      requestAnimationFrame(animateShot);

    }else{

      if(
        Math.abs(ball.position.x)<3.5
      ){

        scoreBlue++;

        updateScore();

        document.getElementById("status").textContent=
          "⚽ GOAL!";

        resetAfterGoal();

      }else{

        ball.position.set(
          shooter.position.x,
          .45,
          shooter.position.z
        );

        ballOwner=shooter;

      }

    }
  }

  animateShot();
}


/* =========================================================
   TACKLE
========================================================= */

function tackle(){

  if(!gameRunning) return;

  const p=controlledPlayer;

  let closest=null;
  let distance=Infinity;

  for(const enemy of redTeam){

    const d=
      enemy.position.distanceTo(p.position);

    if(d<distance){

      distance=d;
      closest=enemy;

    }
  }

  if(
    closest &&
    distance<1.8
  ){

    tackles++;

    /*
      Knock opponent away.
    */

    const push=
      new THREE.Vector3()
        .subVectors(
          closest.position,
          p.position
        )
        .normalize();

    closest.position.add(
      push.multiplyScalar(1.5)
    );

    /*
      If opponent had ball,
      blue player steals it.
    */

    if(ballOwner===closest){

      ballOwner=p;

      controlledPlayer=p;

      document.getElementById("status").textContent=
        "🔥 BALL WON!";

    }

  }
}


/* =========================================================
   RED AI
========================================================= */

function updateRedAI(){

  if(!gameRunning) return;

  for(const enemy of redTeam){

    if(ballOwner===enemy){

      /*
        Red player carries ball toward blue goal.
      */

      enemy.position.z+=.035;

      enemy.rotation.y=Math.PI;

      ball.position.set(
        enemy.position.x,
        .45,
        enemy.position.z+.8
      );

      if(enemy.position.z>18){

        scoreRed++;

        updateScore();

        resetAfterGoal();

        return;
      }

    }else{

      /*
        Chase ball.
      */

      const target=
        ballOwner ||
        ball;

      const direction=
        new THREE.Vector3()
          .subVectors(
            target.position,
            enemy.position
          )
          .normalize();

      enemy.position.add(
        direction.multiplyScalar(.025)
      );

      enemy.rotation.y=
        Math.atan2(
          direction.x,
          direction.z
        );

      /*
        Steal ball.
      */

      if(
        ballOwner &&
        blueTeam.includes(ballOwner)
      ){

        if(
          enemy.position.distanceTo(
            ballOwner.position
          )<.9
        ){

          ballOwner=enemy;

          document.getElementById("status").textContent=
            "😬 BALL LOST!";

        }

      }else if(!ballOwner){

        if(
          enemy.position.distanceTo(ball.position)<1
        ){

          ballOwner=enemy;

        }

      }

    }

  }

}


/* =========================================================
   CAMERA
========================================================= */

const cameraTarget=new THREE.Vector3();

function updateCamera(){

  if(!controlledPlayer) return;

  /*
    Camera stays behind the controlled player.

    The joystick never directly controls
    the camera.
  */

  const offset=new THREE.Vector3(
    0,
    7,
    8
  );

  offset.applyQuaternion(
    controlledPlayer.quaternion
  );

  const desired=
    controlledPlayer.position.clone()
      .add(offset);

  camera.position.lerp(
    desired,
    .08
  );

  cameraTarget.copy(
    controlledPlayer.position
  );

  cameraTarget.y=.7;

  camera.lookAt(cameraTarget);

}


/* =========================================================
   SCORE
========================================================= */

function updateScore(){

  document.getElementById("score").textContent=
    `BLUE ${scoreBlue} - ${scoreRed} RED`;

}


/* =========================================================
   GOAL RESET
========================================================= */

function resetAfterGoal(){

  setTimeout(()=>{

    if(!gameRunning) return;

    for(let i=0;i<blueTeam.length;i++){

      blueTeam[i].position.set(
        bluePositions[i][0],
        0,
        bluePositions[i][1]
      );

    }

    for(let i=0;i<redTeam.length;i++){

      redTeam[i].position.set(
        redPositions[i][0],
        0,
        redPositions[i][1]
      );

    }

    ballOwner=null;

    controlledPlayer=blueTeam[5];

    ball.position.set(
      0,
      .45,
      7
    );

    document.getElementById("status").textContent=
      "Get the ball!";

  },1200);

}


/* =========================================================
   SWITCH PLAYER
========================================================= */

function switchPlayer(){

  if(!gameRunning) return;

  /*
    If somebody on blue team has the ball,
    ALWAYS control that player.
  */

  if(ballOwner &&
     blueTeam.includes(ballOwner)){

    controlledPlayer=ballOwner;

    document.getElementById("status").textContent=
      "⚽ CONTROLLING BALL CARRIER";

    return;
  }

  /*
    Otherwise choose nearest blue player to ball.
  */

  let nearest=null;
  let best=Infinity;

  for(const p of blueTeam){

    const d=
      p.position.distanceTo(ball.position);

    if(d<best){

      best=d;
      nearest=p;

    }

  }

  if(nearest){

    controlledPlayer=nearest;

    document.getElementById("status").textContent=
      "PLAYER SWITCHED";

  }

}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById("pass")
.addEventListener("pointerdown",e=>{
  e.preventDefault();
  passBall();
});

document.getElementById("shoot")
.addEventListener("pointerdown",e=>{
  e.preventDefault();
  shoot();
});

document.getElementById("tackle")
.addEventListener("pointerdown",e=>{
  e.preventDefault();
  tackle();
});

document.getElementById("switch")
.addEventListener("pointerdown",e=>{
  e.preventDefault();
  switchPlayer();
});

const sprintButton=
  document.getElementById("sprint");

sprintButton.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    sprinting=true;
  }
);

sprintButton.addEventListener(
  "pointerup",
  ()=>{
    sprinting=false;
  }
);

sprintButton.addEventListener(
  "pointercancel",
  ()=>{
    sprinting=false;
  }
);


/* =========================================================
   START GAME
========================================================= */

document.getElementById("start")
.addEventListener("click",()=>{

  document.getElementById("menu").style.display="none";

  gameRunning=true;

  startTimer();

});


/* =========================================================
   RESTART
========================================================= */

document.getElementById("restart")
.addEventListener("click",()=>{

  location.reload();

});


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

  const timer=setInterval(()=>{

    if(!gameRunning){

      clearInterval(timer);
      return;

    }

    matchTime--;

    const minutes=
      Math.floor(matchTime/60)
      .toString()
      .padStart(2,"0");

    const seconds=
      (matchTime%60)
      .toString()
      .padStart(2,"0");

    document.getElementById("timer").textContent=
      `${minutes}:${seconds}`;

    if(matchTime<=0){

      gameRunning=false;

      showGameOver();

      clearInterval(timer);

    }

  },1000);

}


/* =========================================================
   GAME OVER
========================================================= */

function showGameOver(){

  const result=
    document.getElementById("result");

  if(scoreBlue>scoreRed){

    result.textContent="🏆 BLUE WIN!";

  }else if(scoreRed>scoreBlue){

    result.textContent="🔴 RED WIN!";

  }else{

    result.textContent="🤝 DRAW!";

  }

  document.getElementById("finalScore").textContent=
    `BLUE ${scoreBlue} - ${scoreRed} RED`;

  document.getElementById("gameover").style.display=
    "flex";

}


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

  requestAnimationFrame(animate);

  /*
    JOYSTICK ONLY MOVES PLAYER
  */

  moveControlledPlayer();

  /*
    Pick up loose ball.
  */

  checkBallPickup();

  /*
    Automatically control whoever
    currently owns the ball.
  */

  controlBallOwner();

  /*
    Ball follows ball carrier.
  */

  if(
    ballOwner &&
    blueTeam.includes(ballOwner)
  ){

    updateBall();

  }

  updateRedAI();

  updateCamera();

  renderer.render(
    scene,
    camera
  );

}

animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener("resize",()=>{

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

});

</script>

</body>
</html>
