<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Football Game V2</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

body {
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    touch-action: none;
}

canvas {
    display: block;
}

#score {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    color: white;
    background: rgba(0,0,0,.65);
    padding: 9px 18px;
    border-radius: 12px;
    font-size: 21px;
    font-weight: bold;
}

#timer {
    position: fixed;
    top: 62px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    color: white;
    background: rgba(0,0,0,.55);
    padding: 6px 15px;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
}

#message {
    position: fixed;
    top: 95px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    color: white;
    font-size: 14px;
    text-align: center;
}

#joystick {
    position: fixed;
    left: 22px;
    bottom: 22px;
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background: rgba(255,255,255,.17);
    border: 2px solid rgba(255,255,255,.4);
    z-index: 30;
}

#stick {
    position: absolute;
    width: 55px;
    height: 55px;
    left: 35px;
    top: 35px;
    border-radius: 50%;
    background: rgba(255,255,255,.8);
}

.button {
    position: fixed;
    z-index: 30;
    width: 82px;
    height: 82px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.5);
    color: white;
    font-size: 12px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.55);
}

#shoot {
    right: 22px;
    bottom: 115px;
}

#pass {
    right: 112px;
    bottom: 28px;
}

#sprint {
    right: 22px;
    bottom: 20px;
}

#restart {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 40;
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: white;
    font-weight: bold;
}

#gameOver {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.78);
    color: white;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

#gameOver h1 {
    font-size: 42px;
    margin: 0 0 15px;
}

#finalScore {
    font-size: 25px;
    margin-bottom: 25px;
}

#playAgain {
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="score">BLUE 0 — 0 RED</div>
<div id="timer">01:30</div>
<div id="message">Move with the joystick</div>

<button id="restart">RESTART</button>

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="shoot" class="button">SHOOT</div>
<div id="pass" class="button">PASS</div>
<div id="sprint" class="button">SPRINT</div>

<div id="gameOver">
    <h1 id="result">FULL TIME</h1>
    <div id="finalScore">BLUE 0 — 0 RED</div>
    <button id="playAgain">PLAY AGAIN</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =====================================================
   SETUP
===================================================== */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
    0x87ceeb,
    40,
    100
);

const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    200
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

document.body.appendChild(renderer.domElement);


/* =====================================================
   LIGHT
===================================================== */

const hemi = new THREE.HemisphereLight(
    0xffffff,
    0x447744,
    2
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(10, 30, 10);

scene.add(sun);


/* =====================================================
   PITCH
===================================================== */

const pitchWidth = 24;
const pitchLength = 38;

const pitch = new THREE.Mesh(
    new THREE.PlaneGeometry(
        pitchWidth,
        pitchLength
    ),
    new THREE.MeshStandardMaterial({
        color: 0x188a35
    })
);

pitch.rotation.x = -Math.PI / 2;

scene.add(pitch);


/* =====================================================
   FIELD LINES
===================================================== */

function makeLine(x1, z1, x2, z2) {

    const geometry =
        new THREE.BufferGeometry()
        .setFromPoints([
            new THREE.Vector3(
                x1,
                .04,
                z1
            ),
            new THREE.Vector3(
                x2,
                .04,
                z2
            )
        ]);

    const line =
        new THREE.Line(
            geometry,
            new THREE.LineBasicMaterial({
                color: 0xffffff
            })
        );

    scene.add(line);
}

makeLine(-12,-19,12,-19);
makeLine(12,-19,12,19);
makeLine(12,19,-12,19);
makeLine(-12,19,-12,-19);

makeLine(-12,0,12,0);


/* Center circle */

const circlePoints = [];

for(let i=0;i<=64;i++){

    const a =
        i / 64 * Math.PI * 2;

    circlePoints.push(
        new THREE.Vector3(
            Math.cos(a) * 3,
            .04,
            Math.sin(a) * 3
        )
    );
}

const centerCircle =
    new THREE.Line(
        new THREE.BufferGeometry()
        .setFromPoints(circlePoints),
        new THREE.LineBasicMaterial({
            color: 0xffffff
        })
    );

scene.add(centerCircle);


/* =====================================================
   GOALS
===================================================== */

function createGoal(z) {

    const group =
        new THREE.Group();

    const material =
        new THREE.MeshStandardMaterial({
            color: 0xffffff
        });

    const postGeometry =
        new THREE.BoxGeometry(
            .3,
            3,
            .3
        );

    const crossGeometry =
        new THREE.BoxGeometry(
            6,
            .3,
            .3
        );

    const left =
        new THREE.Mesh(
            postGeometry,
            material
        );

    left.position.set(
        -3,
        1.5,
        0
    );

    group.add(left);

    const right =
        new THREE.Mesh(
            postGeometry,
            material
        );

    right.position.set(
        3,
        1.5,
        0
    );

    group.add(right);

    const cross =
        new THREE.Mesh(
            crossGeometry,
            material
        );

    cross.position.set(
        0,
        3,
        0
    );

    group.add(cross);


    /* Net */

    const net =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                6,
                3,
                1
            ),
            new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: .12,
                wireframe: true
            })
        );

    net.position.set(
        0,
        1.5,
        z < 0 ? .5 : -.5
    );

    group.add(net);

    group.position.z = z;

    scene.add(group);
}

createGoal(-19);
createGoal(19);


/* =====================================================
   PLAYER
===================================================== */

function createPlayer(color) {

    const group =
        new THREE.Group();

    const body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .45,
                1.1,
                4,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: color
            })
        );

    body.position.y = 1;

    group.add(body);

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .32,
                16,
                16
            ),
            new THREE.MeshStandardMaterial({
                color: 0xffc79b
            })
        );

    head.position.y = 2;

    group.add(head);

    return group;
}


/* Main player */

const player =
    createPlayer(0x1677ff);

player.position.set(
    0,
    0,
    10
);

scene.add(player);


/* =====================================================
   OPPONENTS
===================================================== */

const enemies = [];

const enemyPositions = [
    [-7,0],
    [7,0],
    [-4,-7],
    [4,-7]
];

enemyPositions.forEach(
    pos => {

        const enemy =
            createPlayer(0xff2222);

        enemy.position.set(
            pos[0],
            0,
            pos[1]
        );

        scene.add(enemy);

        enemies.push(enemy);
    }
);


/* =====================================================
   GOALKEEPER
===================================================== */

const goalkeeper =
    createPlayer(0xffaa00);

goalkeeper.scale.set(
    1.05,
    1.05,
    1.05
);

goalkeeper.position.set(
    0,
    0,
    -17.2
);

scene.add(goalkeeper);


/* =====================================================
   BALL
===================================================== */

const ball =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .35,
            20,
            20
        ),
        new THREE.MeshStandardMaterial({
            color: 0xffffff
        })
    );

ball.position.set(
    0,
    .35,
    7
);

scene.add(ball);

let ballVelocity =
    new THREE.Vector3();


/* =====================================================
   SCORE
===================================================== */

let blueScore = 0;
let redScore = 0;

function updateScore(){

    document.getElementById(
        "score"
    ).textContent =
        `BLUE ${blueScore} — ${redScore} RED`;
}


/* =====================================================
   TIMER
===================================================== */

let timeLeft = 90;
let gameRunning = true;

function updateTimer(){

    const minutes =
        Math.floor(timeLeft / 60);

    const seconds =
        Math.floor(timeLeft % 60);

    document.getElementById(
        "timer"
    ).textContent =
        String(minutes).padStart(2,"0")
        + ":" +
        String(seconds).padStart(2,"0");
}


/* =====================================================
   JOYSTICK
===================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

let joystickX = 0;
let joystickY = 0;
let joystickActive = false;

function moveJoystick(x,y){

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;

    let dx =
        x - centerX;

    let dy =
        y - centerY;

    const max =
        rect.width / 2 - 28;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    if(distance > max){

        dx =
            dx / distance * max;

        dy =
            dy / distance * max;
    }

    joystickX =
        dx / max;

    joystickY =
        dy / max;

    stick.style.transform =
        `translate(${dx}px,${dy}px)`;
}

joystick.addEventListener(
    "pointerdown",
    e => {

        joystickActive = true;

        joystick.setPointerCapture(
            e.pointerId
        );

        moveJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointermove",
    e => {

        if(!joystickActive) return;

        moveJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointerup",
    () => {

        joystickActive = false;

        joystickX = 0;
        joystickY = 0;

        stick.style.transform =
            "translate(0px,0px)";
    }
);


/* =====================================================
   SPRINT
===================================================== */

let sprinting = false;

const sprintButton =
    document.getElementById(
        "sprint"
    );

sprintButton.addEventListener(
    "pointerdown",
    () => {
        sprinting = true;
    }
);

sprintButton.addEventListener(
    "pointerup",
    () => {
        sprinting = false;
    }
);

sprintButton.addEventListener(
    "pointercancel",
    () => {
        sprinting = false;
    }
);


/* =====================================================
   SHOOT
===================================================== */

function shoot(){

    if(!gameRunning) return;

    const distance =
        player.position.distanceTo(
            ball.position
        );

    if(distance < 3){

        const direction =
            new THREE.Vector3(
                0,
                0,
                -1
            );

        direction.applyQuaternion(
            player.quaternion
        );

        ballVelocity.copy(
            direction.multiplyScalar(14)
        );

        ballVelocity.y = 5;
    }
}

document.getElementById(
    "shoot"
).addEventListener(
    "pointerdown",
    shoot
);


/* =====================================================
   PASS
===================================================== */

function passBall(){

    if(!gameRunning) return;

    const distance =
        player.position.distanceTo(
            ball.position
        );

    if(distance < 3){

        const direction =
            new THREE.Vector3(
                0,
                0,
                -1
            );

        direction.applyQuaternion(
            player.quaternion
        );

        ballVelocity.copy(
            direction.multiplyScalar(8)
        );

        ballVelocity.y = 2.5;
    }
}

document.getElementById(
    "pass"
).addEventListener(
    "pointerdown",
    passBall
);


/* =====================================================
   RESET BALL
===================================================== */

function resetBall(){

    ball.position.set(
        0,
        .35,
        0
    );

    ballVelocity.set(
        0,
        0,
        0
    );

    player.position.set(
        0,
        0,
        10
    );
}


/* =====================================================
   GOAL
===================================================== */

function scoreGoal(team){

    if(team === "BLUE"){
        blueScore++;
    }else{
        redScore++;
    }

    updateScore();

    document.getElementById(
        "message"
    ).textContent =
        team + " GOAL!";

    setTimeout(() => {

        if(gameRunning){

            document.getElementById(
                "message"
            ).textContent =
                "Keep playing!";
        }

    },1800);

    resetBall();
}


/* =====================================================
   GOALKEEPER AI
===================================================== */

function updateGoalkeeper(delta){

    const targetX =
        THREE.MathUtils.clamp(
            ball.position.x,
            -2.5,
            2.5
        );

    goalkeeper.position.x +=
        (targetX -
        goalkeeper.position.x)
        * Math.min(
            delta * 5,
            1
        );

    goalkeeper.position.z =
        -17.2;

    goalkeeper.lookAt(
        ball.position.x,
        1,
        ball.position.z
    );


    /* Goalkeeper saves ball */

    const distance =
        goalkeeper.position.distanceTo(
            ball.position
        );

    if(distance < 1.25){

        const away =
            ball.position.clone()
            .sub(goalkeeper.position);

        away.y = 0;

        if(away.length() > 0){

            away.normalize();

            ballVelocity.x =
                away.x * 9;

            ballVelocity.z =
                away.z * 9;

            ballVelocity.y = 4;
        }
    }
}


/* =====================================================
   ENEMY AI
===================================================== */

function updateEnemies(delta){

    enemies.forEach(
        enemy => {

            const direction =
                new THREE.Vector3()
                .subVectors(
                    ball.position,
                    enemy.position
                );

            direction.y = 0;

            const distance =
                direction.length();

            if(distance > 1.5){

                direction.normalize();

                enemy.position.add(
                    direction.multiplyScalar(
                        2.5 * delta
                    )
                );

                enemy.rotation.y =
                    Math.atan2(
                        direction.x,
                        direction.z
                    );
            }

            enemy.position.x =
                THREE.MathUtils.clamp(
                    enemy.position.x,
                    -11,
                    11
                );

            enemy.position.z =
                THREE.MathUtils.clamp(
                    enemy.position.z,
                    -17,
                    17
                );
        }
    );
}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

    gameRunning = false;

    joystickX = 0;
    joystickY = 0;

    sprinting = false;

    let result = "DRAW";

    if(blueScore > redScore){
        result = "YOU WIN!";
    }

    if(blueScore < redScore){
        result = "YOU LOSE!";
    }

    document.getElementById(
        "result"
    ).textContent = result;

    document.getElementById(
        "finalScore"
    ).textContent =
        `BLUE ${blueScore} — ${redScore} RED`;

    document.getElementById(
        "gameOver"
    ).style.display = "flex";
}


/* =====================================================
   START / RESTART
===================================================== */

function startGame(){

    blueScore = 0;
    redScore = 0;

    timeLeft = 90;

    gameRunning = true;

    updateScore();
    updateTimer();

    player.position.set(
        0,
        0,
        10
    );

    player.rotation.y = 0;

    ball.position.set(
        0,
        .35,
        7
    );

    ballVelocity.set(
        0,
        0,
        0
    );

    goalkeeper.position.set(
        0,
        0,
        -17.2
    );

    enemies[0].position.set(
        -7,0,0
    );

    enemies[1].position.set(
        7,0,0
    );

    enemies[2].position.set(
        -4,0,-7
    );

    enemies[3].position.set(
        4,0,-7
    );

    document.getElementById(
        "message"
    ).textContent =
        "Move with the joystick";

    document.getElementById(
        "gameOver"
    ).style.display =
        "none";
}

document.getElementById(
    "restart"
).addEventListener(
    "click",
    startGame
);

document.getElementById(
    "playAgain"
).addEventListener(
    "click",
    startGame
);


/* =====================================================
   MAIN GAME LOOP
===================================================== */

const clock =
    new THREE.Clock();

let timerAccumulator = 0;

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );

    if(gameRunning){

        /* TIMER */

        timerAccumulator += delta;

        if(timerAccumulator >= 1){

            timerAccumulator = 0;

            timeLeft--;

            updateTimer();

            if(timeLeft <= 0){

                timeLeft = 0;

                updateTimer();

                endGame();
            }
        }


        /* PLAYER */

        const speed =
            sprinting ? 11 : 7;

        player.position.x +=
            joystickX *
            speed *
            delta;

        player.position.z +=
            joystickY *
            speed *
            delta;

        player.position.x =
            THREE.MathUtils.clamp(
                player.position.x,
                -11,
                11
            );

        player.position.z =
            THREE.MathUtils.clamp(
                player.position.z,
                -17,
                17
            );


        /* PLAYER ROTATION */

        if(
            Math.abs(joystickX) > .1 ||
            Math.abs(joystickY) > .1
        ){

            player.rotation.y =
                Math.atan2(
                    joystickX,
                    joystickY
                );
        }


        /* BALL */

        ballVelocity.y -=
            12 * delta;

        ball.position.add(
            ballVelocity
            .clone()
            .multiplyScalar(delta)
        );

        if(ball.position.y < .35){

            ball.position.y = .35;

            ballVelocity.y *= -.45;
        }


        ballVelocity.x *=
            Math.pow(.985,delta*60);

        ballVelocity.z *=
            Math.pow(.985,delta*60);


        /* SIDE WALLS */

        if(ball.position.x > 11.5){

            ball.position.x = 11.5;

            ballVelocity.x *= -.7;
        }

        if(ball.position.x < -11.5){

            ball.position.x = -11.5;

            ballVelocity.x *= -.7;
        }


        /* GOALS */

        if(
            ball.position.z < -18.5 &&
            Math.abs(ball.position.x) < 3
        ){

            scoreGoal("BLUE");
        }

        if(
            ball.position.z > 18.5 &&
            Math.abs(ball.position.x) < 3
        ){

            scoreGoal("RED");
        }


        updateEnemies(delta);

        updateGoalkeeper(delta);
    }


    /* CAMERA */

    const offset =
        new THREE.Vector3(
            0,
            8,
            10
        );

    offset.applyQuaternion(
        player.quaternion
    );

    const target =
        player.position
        .clone()
        .add(offset);

    camera.position.lerp(
        target,
        .1
    );

    camera.lookAt(
        player.position.x,
        .5,
        player.position.z - 3
    );


    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* START */

startGame();

animate();

</script>

</body>
</html>
